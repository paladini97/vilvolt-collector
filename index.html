<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoVivolt — Statistiques et réservation</title>
  
  <!-- Inclusions des bibliothèques externes -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #ff7f00;
      color: #222222;
    }
    
    .container {
      max-width: 950px;
      margin: 20px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
    
    h1 {
      color: #ffffff;
      font-size: 2.8rem;
      margin-top: 0;
      margin-bottom: 6px;
      text-align: center;
      text-shadow: 
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
        -3px  0px 0 #000,
         3px  0px 0 #000,
         0px -3px 0 #000,
         0px  3px 0 #000;
      letter-spacing: 1px;
    }
    
    p.subtitle {
      color: #444444;
      margin-bottom: 25px;
      font-size: 1rem;
      text-align: center;
    }
    
    #map {
      height: 350px;
      width: 100%;
      border-radius: 8px;
      margin-bottom: 25px;
      border: 1px solid #cccccc;
      z-index: 1;
    }
    
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .control-group {
      flex: 1;
      min-width: 160px;
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333333;
      font-size: 0.9rem;
    }
    
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #cccccc;
      font-size: 0.95rem;
      background-color: #ffffff;
      color: #222222;
    }
    
    .reservation-box {
      background: #f0f4f8;
      border-left: 5px solid #2b5797;
      padding: 16px 20px;
      border-radius: 6px;
      margin-bottom: 25px;
    }
    
    .reservation-box.critical {
      background: #fdf0f0;
      border-left-color: #d9534f;
    }
    
    .reservation-box.warning {
      background: #fef8e7;
      border-left-color: #f0ad4e;
    }
    
    .reservation-box h3 {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
      color: #111111;
    }
    
    .reservation-box p {
      margin: 0;
      font-size: 0.95rem;
      color: #222222;
      line-height: 1.5;
    }
    
    .highlight {
      font-weight: bold;
      color: #000000;
    }
    
    .alert-warn {
      color: #d9534f;
      font-weight: bold;
    }
    
    .chart-box {
      position: relative;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>InfoVivolt</h1>
  <p class="subtitle">Consultation de la disponibilité des vélos et aide au choix de l'horaire de réservation</p>

  <div id="map"></div>

  <div class="controls">
    <div class="control-group" style="flex: 2; min-width: 200px;">
      <label for="stationSelect">Station :</label>
      <select id="stationSelect" onchange="changerStationDepuisSelect()"></select>
    </div>

    <div class="control-group">
      <label for="jourSelect">Jour :</label>
      <select id="jourSelect" onchange="chargerGraphique()">
        <option value="1">Lundi</option>
        <option value="2">Mardi</option>
        <option value="3">Mercredi</option>
        <option value="4">Jeudi</option>
        <option value="5">Vendredi</option>
        <option value="6">Samedi</option>
        <option value="0">Dimanche</option>
      </select>
    </div>

    <div class="control-group">
      <label for="heureSelect">Heure :</label>
      <select id="heureSelect" onchange="calculerConseilMinute()"></select>
    </div>

    <div class="control-group">
      <label for="minuteSelect">Minute (0-59) :</label>
      <select id="minuteSelect" onchange="calculerConseilMinute()"></select>
    </div>

    <div class="control-group">
      <label for="delaiSelect">Anticipation minimale :</label>
      <select id="delaiSelect" onchange="calculerConseilMinute()">
        <option value="1">1 minute avant</option>
        <option value="2">2 minutes avant</option>
        <option value="3" selected>3 minutes avant</option>
        <option value="4">4 minutes avant</option>
        <option value="5">5 minutes avant</option>
      </select>
    </div>
  </div>

  <div id="boxConseil" class="reservation-box">
    <h3>Recommandation de réservation</h3>
    <p id="conseilTexte">Veuillez sélectionner une station et un horaire pour afficher les informations.</p>
  </div>

  <div class="chart-box">
    <canvas id="monGraphique"></canvas>
  </div>
</div>

<footer>
  Créé par Patrick Laurent le poisson
</footer>

<script>
  // =========================================================================
  // CONFIGURATION SUPABASE
  // =========================================================================
  const SUPABASE_URL = "https://xglbbrcjsuuomnjkvhmx.supabase.co";
  
  // ---> INSERER VOTRE CLE PUBLIQUE (anon key) DANS LA VARIABLE CI-DESSOUS <---
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnbGJicmNqc3V1b21uamt2aG14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MzgwMTIsImV4cCI6MjEwNjExNDAxMn0.rxKnU1XYH0smwsnjXtYQpNsZzol-Tg5Ik8ZK-SaiPF4";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let chart = null;
  let map = null;
  let marqueurs = {};
  let donneesGlobales = [];

  function remplirHeuresEtMinutes() {
    const selectH = document.getElementById('heureSelect');
    const selectM = document.getElementById('minuteSelect');

    selectH.innerHTML = "";
    selectM.innerHTML = "";

    for (let h = 0; h < 24; h++) {
      const opt = document.createElement('option');
      opt.value = h;
      opt.textContent = `${String(h).padStart(2, '0')} h`;
      selectH.appendChild(opt);
    }

    for (let m = 0; m < 60; m++) {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = `${String(m).padStart(2, '0')} min`;
      selectM.appendChild(opt);
    }

    const maintenant = new Date();
    selectH.value = maintenant.getHours();
    selectM.value = maintenant.getMinutes();
  }

  function initialiserCarte() {
    map = L.map('map').setView([48.1742, 6.4496], 13);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    setTimeout(() => { if (map) map.invalidateSize(); }, 300);
  }

  // Nettoyage des chaînes pour comparer les noms de stations Supabase et GBFS
  function normaliserNom(nom) {
    return (nom || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]/g, "");
  }

  async function chargerCoordonneesGBFS() {
    let dictCoords = {};
    const urlsGBFS = [
      "https://gbfs.partners.fifteen.eu/gbfs/epinal/fr/station_information.json",
      "https://gbfs.partners.fifteen.eu/gbfs/epinal/station_information.json",
      "https://transport.data.gouv.fr/gbfs/vilvolt/station_information.json"
    ];

    for (const url of urlsGBFS) {
      try {
        const res = await fetch(url);
        if (!res.ok) continue;
        const json = await res.json();
        const stations = json?.data?.stations || [];
        if (stations.length > 0) {
          stations.forEach(st => {
            if (st.name && st.lat && st.lon) {
              dictCoords[normaliserNom(st.name)] = [st.lat, st.lon];
            }
          });
          break; // Si trouvé, on s'arrête
        }
      } catch (e) {
        console.warn("Tentative GBFS échouée sur :", url);
      }
    }
    return dictCoords;
  }

  async function chargerToutesLesStationsDepuisSupabase() {
    const selectStation = document.getElementById('stationSelect');
    selectStation.innerHTML = "<option>Chargement des stations en cours...</option>";

    try {
      let stationsUniques = [];

      // 1. Récupération des noms exacts des stations dans Supabase
      const { data: dataVue, error: errVue } = await supabaseClient
        .from('vue_stations')
        .select('nom_station');

      if (!errVue && dataVue && dataVue.length > 0) {
        stationsUniques = [...new Set(dataVue.map(s => s.nom_station))].sort();
      } else {
        const { data: dataTable, error: errTable } = await supabaseClient
          .from('moyennes_5min')
          .select('nom_station');

        if (errTable) throw errTable;
        if (dataTable) {
          stationsUniques = [...new Set(dataTable.map(s => s.nom_station))].sort();
        }
      }

      if (stationsUniques.length === 0) {
        selectStation.innerHTML = "<option>Aucune station trouvée</option>";
        return;
      }

      selectStation.innerHTML = "";

      // 2. Chargement du dictionnaire des coordonnées GPS officielles Vilvolt (GBFS)
      const coordsGBFS = await chargerCoordonneesGBFS();

      // 3. Remplissage du selecteur HTML
      for (const nom of stationsUniques) {
        const option = document.createElement('option');
        option.value = nom;
        option.textContent = nom;
        selectStation.appendChild(option);
      }

      // 4. Positionnement précis de chaque marqueur sur la carte Leaflet
      for (const nom of stationsUniques) {
        const nomNorm = normaliserNom(nom);
        
        // Recherche de la clé correspondant le mieux dans GBFS
        let coords = coordsGBFS[nomNorm];
        if (!coords) {
          const cleTrouvee = Object.keys(coordsGBFS).find(k => k.includes(nomNorm) || nomNorm.includes(k));
          if (cleTrouvee) {
            coords = coordsGBFS[cleTrouvee];
          }
        }

        // Si non trouvé dans le flux GBFS, fallback par défaut au centre d'Épinal
        if (!coords) {
          coords = [48.1742, 6.4496];
        }

        if (!marqueurs[nom]) {
          const marker = L.marker(coords).addTo(map);
          marker.bindPopup(`<b>${nom}</b>`);
          marker.on('click', () => {
            selectStation.value = nom;
            changerStationDepuisSelect();
          });
          marqueurs[nom] = marker;
        }
      }

      if (stationsUniques.length > 0) {
        selectStation.value = stationsUniques[0];
        changerStationDepuisSelect();
      }
    } catch (e) {
      console.error("Erreur d'accès à Supabase :", e);
      selectStation.innerHTML = "<option>Erreur d'accès aux données</option>";
      document.getElementById('conseilTexte').innerHTML = `<span class="alert-warn">Impossible de se connecter à la base de données. Vérifiez la clé API Supabase et les accès RLS.</span>`;
    }
  }

  async function initialiser() {
    initialiserCarte();
    remplirHeuresEtMinutes();

    const jourActuel = new Date().getDay();
    document.getElementById('jourSelect').value = jourActuel;

    await chargerToutesLesStationsDepuisSupabase();
  }

  function changerStationDepuisSelect() {
    const stationNom = document.getElementById('stationSelect').value;
    const marker = marqueurs[stationNom];

    if (marker && map) {
      map.panTo(marker.getLatLng());
      marker.openPopup();
    }

    chargerGraphique();
  }

  async function chargerGraphique() {
    const station = document.getElementById('stationSelect').value;
    const jour = parseInt(document.getElementById('jourSelect').value);

    if (!station || station.includes("Chargement") || station.includes("Erreur")) return;

    try {
      const { data, error } = await supabaseClient
        .from('moyennes_5min')
        .select('heure, minute, moyenne_velos')
        .eq('nom_station', station)
        .eq('jour_semaine', jour)
        .order('heure', { ascending: true })
        .order('minute', { ascending: true });

      if (error) {
        console.error("Erreur de requête :", error);
        donneesGlobales = [];
      } else {
        // Décalage UTC -> Heure locale utilisateur (ex: UTC+1 ou UTC+2)
        const decalageHeures = -new Date().getTimezoneOffset() / 60;

        donneesGlobales = (data || []).map(d => {
          let heureLocale = (d.heure + decalageHeures) % 24;
          if (heureLocale < 0) heureLocale += 24;

          return {
            ...d,
            heure: heureLocale
          };
        });

        // Tri par heure locale croissante
        donneesGlobales.sort((a, b) => (a.heure * 60 + a.minute) - (b.heure * 60 + b.minute));
      }
    } catch (e) {
      console.error("Erreur lors du chargement des données du graphique :", e);
      donneesGlobales = [];
    }

    const labels = donneesGlobales.map(d => `${String(d.heure).padStart(2, '0')}:${String(d.minute).padStart(2, '0')}`);
    const valeurs = donneesGlobales.map(d => d.moyenne_velos);

    if (chart) {
      chart.destroy();
    }

    const ctx = document.getElementById('monGraphique').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels.length > 0 ? labels : ['00:00'],
        datasets: [{
          label: `Nombre moyen de vélos disponibles (${station})`,
          data: valeurs.length > 0 ? valeurs : [0],
          borderColor: '#ff7f00',
          backgroundColor: 'rgba(255, 127, 0, 0.1)',
          fill: true,
          tension: 0.2,
          pointRadius: 2
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 }, title: { display: true, text: 'Vélos disponibles' } },
          x: { title: { display: true, text: 'Horaire (par tranche de 5 min)' } }
        }
      }
    });

    calculerConseilMinute();
  }

  function estimerVelosAMinute(h, m) {
    if (!donneesGlobales || donneesGlobales.length === 0) return 0;

    const mBase = Math.floor(m / 5) * 5;
    const mSuiv = (mBase + 5) % 60;
    const hSuiv = mBase === 55 ? (h + 1) % 24 : h;

    const d1 = donneesGlobales.find(d => d.heure === h && d.minute === mBase);
    const d2 = donneesGlobales.find(d => d.heure === hSuiv && d.minute === mSuiv);

    const v1 = d1 ? d1.moyenne_velos : 0;
    const v2 = d2 ? d2.moyenne_velos : v1;

    const fraction = (m - mBase) / 5;
    return v1 + (v2 - v1) * fraction;
  }

  function calculerConseilMinute() {
    const hVise = parseInt(document.getElementById('heureSelect').value);
    const mVise = parseInt(document.getElementById('minuteSelect').value);
    const delaiMin = parseInt(document.getElementById('delaiSelect').value);
    const station = document.getElementById('stationSelect').value;
    const boxEl = document.getElementById('boxConseil');

    if (!donneesGlobales || donneesGlobales.length === 0) {
      boxEl.className = "reservation-box";
      document.getElementById('conseilTexte').innerHTML = `Aucune donnée disponible pour cet horaire ou cette station.`;
      return;
    }

    const velosVises = estimerVelosAMinute(hVise, mVise);

    let mPrecedente = mVise - 10;
    let hPrecedente = hVise;
    if (mPrecedente < 0) {
      mPrecedente += 60;
      hPrecedente = (hVise - 1 + 24) % 24;
    }
    const velosAvant = estimerVelosAMinute(hPrecedente, mPrecedente);
    const debitConsommation = (velosAvant - velosVises) / 10;

    let delaiRecommande = delaiMin;

    if (debitConsommation > 0.3) {
      delaiRecommande = Math.min(5, delaiMin + 2);
    } else if (debitConsommation > 0.15) {
      delaiRecommande = Math.min(5, delaiMin + 1);
    }

    let mResa = mVise - delaiRecommande;
    let hResa = hVise;
    if (mResa < 0) {
      mResa += 60;
      hResa = (hVise - 1 + 24) % 24;
    }
    const velosResa = estimerVelosAMinute(hResa, mResa);

    const txtVise = `${String(hVise).padStart(2, '0')}:${String(mVise).padStart(2, '0')}`;
    const txtResa = `${String(hResa).padStart(2, '0')}:${String(mResa).padStart(2, '0')}`;

    boxEl.className = "reservation-box";

    let conseilHTML = `<b>À ${txtVise} :</b> environ <b>${velosVises.toFixed(1)} vélo(s)</b> disponible(s) à la station ${station}.<br><br>`;

    if (velosVises <= 0.6) {
      boxEl.classList.add("critical");
      conseilHTML += `<span class="alert-warn">Attention : risque élevé d'absence de vélos.</span><br>`;
      conseilHTML += `La station atteint un niveau très bas autour de ${txtVise}.<br>`;
      conseilHTML += `Conseil : lancez la réservation dès <span class="highlight">${txtResa}</span> (${delaiRecommande} minutes avant votre départ) pour réserver le prochain vélo disponible.`;
    } 
    else if (debitConsommation > 0.2) {
      boxEl.classList.add("warning");
      const perteTotale = (debitConsommation * 5).toFixed(1);
      conseilHTML += `<b>Période de forte demande :</b> baisse estimée à environ ${perteTotale} vélos toutes les 5 minutes.<br>`;
      if (delaiRecommande > delaiMin) {
        conseilHTML += `L'anticipation recommandée a été portée de ${delaiMin} à ${delaiRecommande} minutes afin d'assurer votre réservation.<br>`;
      }
      conseilHTML += `Conseil : effectuez votre réservation à <span class="highlight">${txtResa}</span> (environ ${velosResa.toFixed(1)} vélos encore disponibles à cet instant).`;
    } 
    else {
      conseilHTML += `<b>Fréquentation normale :</b> la disponibilité reste stable sur ce créneau.<br>`;
      conseilHTML += `Conseil : vous pouvez réserver votre vélo à <span class="highlight">${txtResa}</span> (${delaiRecommande} minutes avant).`;
    }

    document.getElementById('conseilTexte').innerHTML = conseilHTML;
  }

  window.addEventListener('DOMContentLoaded', initialiser);
</script>

</body>
</html>

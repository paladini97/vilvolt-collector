    function remplirHeuresEtMinutes() {
      const selectH = document.getElementById('heureSelect');
      const selectM = document.getElementById('minuteSelect');

      selectH.innerHTML = "";
      selectM.innerHTML = "";

      for (let h = 0; h < 24; h++) {
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = `${String(h).padStart(2, '0')} h`;
        selectH.appendChild(opt);
      }

      for (let m = 0; m < 60; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = `${String(m).padStart(2, '0')} min`;
        selectM.appendChild(opt);
      }

      const maintenant = new Date();
      selectH.value = maintenant.getHours();
      selectM.value = maintenant.getMinutes();
    }

    function initialiserCarte() {
      map = L.map('map').setView([48.1742, 6.4496], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      setTimeout(() => { if (map) map.invalidateSize(); }, 300);
    }

    function normaliserNom(nom) {
      return (nom || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    async function chargerCoordonneesGBFS() {
      let dictCoords = {};

      const urlsGBFS = [
        "https://gbfs.partners.fifteen.eu/gbfs/epinal/fr/station_information.json",
        "https://gbfs.partners.fifteen.eu/gbfs/epinal/station_information.json",
        "https://transport.data.gouv.fr/gbfs/vilvolt/station_information.json"
      ];

      for (const url of urlsGBFS) {
        try {
          const res = await fetch(url);

          if (!res.ok) continue;

          const json = await res.json();
          const stations = json?.data?.stations || [];

          if (stations.length > 0) {
            stations.forEach(st => {
              if (st.name && st.lat && st.lon) {
                dictCoords[normaliserNom(st.name)] = [st.lat, st.lon];
              }
            });

            break;
          }
        } catch (e) {
          console.warn("Erreur de récupération GBFS :", url);
        }
      }

      return dictCoords;
    }

    async function chargerToutesLesStationsDepuisSupabase() {
      const selectStation = document.getElementById('stationSelect');
      selectStation.innerHTML = "<option>Chargement des stations en cours...</option>";

      try {
        let stationsUniques = [];

        const { data: dataTable, error: errTable } = await supabaseClient
          .from('moyennes_5min')
          .select('nom_station');

        if (errTable) throw errTable;

        if (dataTable) {
          stationsUniques = [...new Set(dataTable.map(s => s.nom_station))].sort();
        }

        if (stationsUniques.length === 0) {
          selectStation.innerHTML = "<option>Aucune station trouvée</option>";
          return;
        }

        selectStation.innerHTML = "";

        const coordsGBFS = await chargerCoordonneesGBFS();

        for (const nom of stationsUniques) {
          const option = document.createElement('option');
          option.value = nom;
          option.textContent = nom;
          selectStation.appendChild(option);
        }

        for (const nom of stationsUniques) {
          const nomNorm = normaliserNom(nom);
          let coords = coordsGBFS[nomNorm];

          if (!coords) {
            const cleTrouvee = Object.keys(coordsGBFS).find(k =>
              k.includes(nomNorm) || nomNorm.includes(k)
            );

            if (cleTrouvee) coords = coordsGBFS[cleTrouvee];
          }

          if (!coords) coords = [48.1742, 6.4496];

          if (!marqueurs[nom]) {
            const marker = L.marker(coords).addTo(map);

            marker.bindPopup(`<b>${nom}</b>`);

            marker.on('click', () => {
              selectStation.value = nom;
              changerStationDepuisSelect();
            });

            marqueurs[nom] = marker;
          }
        }

        if (stationsUniques.length > 0) {
          selectStation.value = stationsUniques[0];
          changerStationDepuisSelect();
        }

      } catch (e) {
        console.error("Erreur d'accès à Supabase :", e);

        selectStation.innerHTML = "<option>Erreur d'accès aux données</option>";

        document.getElementById('conseilTexte').innerHTML =
          `<span class="alert-warn">Impossible de se connecter à la base de données. Vérifiez la clé API Supabase.</span>`;
      }
    }

    async function initialiser() {
      initialiserCarte();
      remplirHeuresEtMinutes();

      // Conversion du jour JS (0=Dimanche) vers ISO Supabase (1=Lundi ... 7=Dimanche)
      let jourActuel = new Date().getDay();

      if (jourActuel === 0) jourActuel = 7;

      document.getElementById('jourSelect').value = jourActuel;

      await chargerToutesLesStationsDepuisSupabase();
    }

    function changerStationDepuisSelect() {
      const stationNom = document.getElementById('stationSelect').value;
      const marker = marqueurs[stationNom];

      if (marker && map) {
        map.panTo(marker.getLatLng());
        marker.openPopup();
      }

      chargerGraphique();
    }

    async function chargerGraphique() {
      const station = document.getElementById('stationSelect').value;
      const jour = parseInt(document.getElementById('jourSelect').value);

      if (!station || station.includes("Chargement") || station.includes("Erreur")) return;

      try {
        const { data, error } = await supabaseClient
          .from('moyennes_5min')
          .select('heure, minute, moyenne_velos')
          .eq('nom_station', station)
          .eq('jour_semaine', jour)
          .order('heure', { ascending: true })
          .order('minute', { ascending: true });

        if (error || !data) {
          console.error("Erreur de requête Supabase :", error);
          donneesGlobales = [];
        } else {
          donneesGlobales = data;
        }

      } catch (e) {
        console.error("Erreur lors du chargement des données :", e);
        donneesGlobales = [];
      }

      const labels = donneesGlobales.map(d =>
        `${String(d.heure).padStart(2, '0')}:${String(d.minute).padStart(2, '0')}`
      );

      const valeurs = donneesGlobales.map(d => d.moyenne_velos);

      if (chart) {
        chart.destroy();
      }

      const ctx = document.getElementById('monGraphique').getContext('2d');

      chart = new Chart(ctx, {
        type: 'line',

        data: {
          labels: labels.length > 0 ? labels : ['Aucune donnée'],

          datasets: [{
            label: `Nombre moyen de vélos disponibles (${station})`,
            data: valeurs.length > 0 ? valeurs : [0],
            borderColor: '#ff7f00',
            backgroundColor: 'rgba(255, 127, 0, 0.1)',
            fill: true,
            tension: 0.2,
            pointRadius: 2
          }]
        },

        options: {
          responsive: true,

          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                stepSize: 1
              },
              title: {
                display: true,
                text: 'Vélos disponibles'
              }
            },

            x: {
              title: {
                display: true,
                text: 'Horaire (par tranche de 5/10/15 min ; selon données)'
              }
            }
          }
        }
      });

      calculerConseilMinute();
    }

    function estimerVelosAMinute(h, m) {
      if (!donneesGlobales || donneesGlobales.length === 0) return 0;

      const mBase = Math.floor(m / 5) * 5;
      const mSuiv = (mBase + 5) % 60;
      const hSuiv = mBase === 55 ? (h + 1) % 24 : h;

      const d1 = donneesGlobales.find(
        d => d.heure === h && d.minute === mBase
      );

      const d2 = donneesGlobales.find(
        d => d.heure === hSuiv && d.minute === mSuiv
      );

      const v1 = d1 ? d1.moyenne_velos : 0;
      const v2 = d2 ? d2.moyenne_velos : v1;

      const fraction = (m - mBase) / 5;

      return v1 + (v2 - v1) * fraction;
    }

    function estZoneEpinalGolbey(nom) {

      return n.includes('epinal') || n.includes('golbey');

    function minutesDepuisMinuit(h, m) {
      return h * 60 + m;
    }

    function dansFenetre(h, m, debut, fin) {
      const x = minutesDepuisMinuit(h, m);
      return x >= debut && x <= fin;
    }

    // Signal horaire basé sur les créneaux récurrents connus des établissements
    // scolaires d'Épinal. Ce n'est pas un état temps réel d'un établissement.
    function obtenirSignalEcoles(h, m) {
      const t = minutesDepuisMinuit(h, m);
      const sorties = [12 * 60 + 55, 15 * 60 + 50, 17 * 60, 17 * 60 + 55, 18 * 60];
      const entrees = [8 * 60, 9 * 60 + 50, 14 * 60, 16 * 60 + 5];

      const sortieProche = sorties.some(x => Math.abs(x - t) <= 5);
      const entreeProche = entrees.some(x => Math.abs(x - t) <= 5);

      if (sortieProche) {
        return {
          actif: true,
          facteur: 1.22,
          texte: ' Signal écoles : sortie de cours proche, demande potentiellement en hausse.'
        };
      }

      if (entreeProche) {
        return {
          actif: true,
          facteur: 1.08,
          texte: ' Signal écoles : arrivée/reprise des cours proche.'
        };
      }

      // Renforcement des périodes de pause méridienne et de fin de journée.
      if (dansFenetre(h, m, 12 * 60 + 20, 13 * 60 + 30)) {
        return {
          actif: true,
          facteur: 1.12,
          texte: ' Signal écoles : créneau méridien, déplacements scolaires possibles.'
        };
      }

      if (dansFenetre(h, m, 16 * 60 + 45, 18 * 60 + 15)) {
        return {
          actif: true,
          facteur: 1.15,
          texte: ' Signal écoles : fin de journée scolaire, demande potentiellement renforcée.'
        };
      }

      return {
        actif: false,
        facteur: 1,
        texte: ' Signal écoles : pas de pic scolaire identifié sur ce créneau.'
      };
    }

    function minutesTrain(train) {
      return train.h * 60 + train.m;
    }

    function obtenirProchainesArriveesTrains(h, m, nombre = 3) {
      const cible = h * 60 + m;
      return ARRIVEES_GARE_EPINAL
        .map(train => {
          let delta = minutesTrain(train) - cible;
          if (delta < 0) delta += 1440;
          return { ...train, delta };
        })
        .sort((a, b) => a.delta - b.delta)
        .slice(0, nombre);
    }

    function obtenirProchaineArriveeTrain(h, m) {
      return obtenirProchainesArriveesTrains(h, m, 1)[0] || null;
    }

    function obtenirSignalFerroviaire(h, m) {
      const cible = h * 60 + m;
      const trainsDuJour = ARRIVEES_GARE_EPINAL
        .slice()
        .sort((a, b) => minutesTrain(a) - minutesTrain(b));

      const prochain = trainsDuJour
        .map(train => ({
          train,
          delta: minutesTrain(train) - cible
        }))
        .find(x => x.delta >= 0);

      const prochainEffectif = prochain || {
        train: trainsDuJour[0],
        delta: minutesTrain(trainsDuJour[0]) + 1440 - cible
      };

      const facteur = prochainEffectif.delta <= 2 ? 1.18
        : prochainEffectif.delta <= 5 ? 1.11
        : prochainEffectif.delta <= 10 ? 1.06
        : 1;

      const lignes = trainsDuJour.map(train => {
        const minuteTrain = minutesTrain(train);
        let delta = minuteTrain - cible;
        if (delta < 0) delta += 1440;

        let statut;
        if (delta === 0) statut = 'maintenant';
        else if (delta < 60) statut = `dans ${delta} min`;
        else statut = `dans ${Math.floor(delta / 60)} h ${delta % 60} min`;

        const numero = train.numero ? ` ${train.numero}` : '';
        return `${String(train.h).padStart(2, '0')}h${String(train.m).padStart(2, '0')} — ${train.type}${numero}, en provenance de ${train.provenance} (${statut})`;
      });

      return {
        facteur,
        texte: `Arrivées gare d'Épinal sur la journée :<br>${lignes.join('<br>')}`
      };
    }

    function obtenirFacteurHoraireEpinal(h, m) {
      const t = minutesDepuisMinuit(h, m);
      if (dansFenetre(h, m, 7 * 60, 9 * 60 + 15)) return 1.08;
      if (dansFenetre(h, m, 11 * 60 + 30, 14 * 60)) return 1.15;
      if (dansFenetre(h, m, 16 * 60, 19 * 60 + 15)) return 1.18;
      if (dansFenetre(h, m, 19 * 60 + 15, 21 * 60)) return 1.08;
      return 1;
    }

    async function chargerEtatStationsVoisines() {
      if (stationsTempsReel && coordonneesTempsReel) return;

      try {
        const [statusRes, infoRes] = await Promise.all([
          fetch('https://gbfs.partners.fifteen.eu/gbfs/2.2/epinal/en/station_status.json'),
          fetch('https://gbfs.partners.fifteen.eu/gbfs/2.2/epinal/en/station_information.json')
        ]);

        if (!statusRes.ok || !infoRes.ok) throw new Error('GBFS indisponible');

        const statusJson = await statusRes.json();
        const infoJson = await infoRes.json();

        stationsTempsReel = {};
        coordonneesTempsReel = {};

        for (const st of (statusJson?.data?.stations || [])) {
          stationsTempsReel[String(st.station_id)] = {
            velos: Number(st.num_bikes_available || 0),
            places: Number(st.num_docks_available || 0)
          };
        }

        for (const st of (infoJson?.data?.stations || [])) {
          if (st.name && Number.isFinite(Number(st.lat)) && Number.isFinite(Number(st.lon))) {
            coordonneesTempsReel[normaliserNom(st.name)] = {
              id: String(st.station_id),
              nom: st.name,
              lat: Number(st.lat),
              lon: Number(st.lon)
            };
          }
        }
      } catch (e) {
        console.warn('Impossible de charger les stations voisines :', e);
        stationsTempsReel = {};
        coordonneesTempsReel = {};
      }
    }

    function distanceMetres(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180;
      const dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    async function trouverStationsVoisines(stationNom) {
      if (!estZoneEpinalGolbey(stationNom)) return [];

      await chargerEtatStationsVoisines();
      if (!coordonneesTempsReel || !stationsTempsReel) return [];

      const stationNorm = normaliserNom(stationNom);
      const origine = Object.values(coordonneesTempsReel).find(s =>
        normaliserNom(s.nom) === stationNorm ||
        normaliserNom(s.nom).includes(stationNorm) ||
        stationNorm.includes(normaliserNom(s.nom))
      );

      if (!origine) return [];

      return Object.values(coordonneesTempsReel)
        .filter(s => normaliserNom(s.nom) !== normaliserNom(origine.nom))
        .map(s => {
          const etat = stationsTempsReel[s.id] || { velos: 0, places: 0 };
          return {
            ...s,
            velos: etat.velos,
            places: etat.places,
            distance: distanceMetres(origine.lat, origine.lon, s.lat, s.lon)
          };
        })
        .filter(s => s.distance <= 1000 && s.velos > 0)
        .sort((a, b) => a.distance - b.distance || b.velos - a.velos)
        .slice(0, 3);
    }

    // =========================================================================
    // PREVISION RENFORCEE : 5 MIN + TENDANCE + APPRENTISSAGE + GARE
    // =========================================================================

    let historiqueAdaptatif = null;

    function cleApprentissage(station, jour, h) {
      return `infovivolt_adapt_${normaliserNom(station)}_${jour}_${h}`;
    }

    function lireCorrectionAdaptive(station, jour, h) {
      try {
        const raw = localStorage.getItem(cleApprentissage(station, jour, h));
        if (!raw) return 1;
        const obj = JSON.parse(raw);
        if (!obj || !obj.semaine) return 1;
        const semaineActuelle = Math.floor(Date.now() / (7 * 24 * 3600 * 1000));
        // La correction est réinitialisée progressivement chaque semaine.
        if (semaineActuelle - obj.semaine > 4) return 1;
        return Math.max(0.75, Math.min(1.25, Number(obj.facteur) || 1));
      } catch (_) {
        return 1;
      }
    }

    function enregistrerCorrectionAdaptive(station, jour, h, facteurObserve) {
      try {
        const cle = cleApprentissage(station, jour, h);
        const semaine = Math.floor(Date.now() / (7 * 24 * 3600 * 1000));
        const ancien = JSON.parse(localStorage.getItem(cle) || 'null');
        const precedent = ancien && ancien.semaine === semaine ? Number(ancien.facteur) || 1 : 1;
        // Apprentissage lent : une observation ne peut pas bouleverser le modèle.
        const nouveau = precedent * 0.85 + facteurObserve * 0.15;
        localStorage.setItem(cle, JSON.stringify({ semaine, facteur: Math.max(0.75, Math.min(1.25, nouveau)) }));
      } catch (_) {}
    }

    async function chargerHistoriqueRecent(station) {
      if (!station) return [];
      try {
        const limite = new Date();
        limite.setDate(limite.getDate() - 60);
        const { data, error } = await supabaseClient
          .from('releves_vilvolt')
          .select('velos_disponibles,date_releve')
          .eq('nom_station', station)
          .gte('date_releve', limite.toISOString())
          .order('date_releve', { ascending: false })
          .limit(5000);
        if (error || !data) return [];
        return data;
      } catch (_) {
        return [];
      }
    }

    function calculerTendanceRecente(releves, h, m) {
      if (!releves || releves.length < 2) return 0;
      const maintenant = Date.now();
      const points = releves
        .map(r => ({
          t: new Date(r.date_releve).getTime(),
          v: Number(r.velos_disponibles)
        }))
        .filter(r => Number.isFinite(r.t) && Number.isFinite(r.v))
        .filter(r => maintenant - r.t <= 20 * 60 * 1000)
        .sort((a,b) => a.t-b.t);

      if (points.length < 2) return 0;
      const debut = points[0], fin = points[points.length - 1];
      const minutes = Math.max(1, (fin.t - debut.t) / 60000);
      return (fin.v - debut.v) / minutes;
    }

    function prevoir5Minutes(h, m, base, tendance, facteurAdaptatif, facteurContexte) {
      const resultat = [];
      for (let i = 0; i <= PREVISION_MAX_MINUTES; i++) {
        const valeurTendance = base + tendance * i;
        const valeur = Math.max(0, valeurTendance * facteurAdaptatif / Math.max(1, facteurContexte));
        resultat.push({ minute: i, velos: valeur });
      }
      return resultat;
    }

    function analyserRemplissage(releves) {
      if (!releves || releves.length < 2) return null;
      const maintenant = Date.now();
      const points = releves
        .map(r => ({ t: new Date(r.date_releve).getTime(), v: Number(r.velos_disponibles) }))
        .filter(r => Number.isFinite(r.t) && Number.isFinite(r.v))
        .filter(r => maintenant - r.t <= 15 * 60 * 1000)
        .sort((a,b) => a.t-b.t);
      if (points.length < 2) return null;
      const d = points[points.length - 1].v - points[0].v;
      if (d <= -3) return { emoji:'🔻', texte:`Station en forte baisse : ${Math.round(Math.abs(d))} vélo(s) perdu(s) en ~15 min.` };
      if (d <= -1) return { emoji:'↘️', texte:`Station en baisse : ${Math.round(Math.abs(d))} vélo(s) en moins récemment.` };
      if (d >= 3) return { emoji:'🔺', texte:`Station en remplissage : +${Math.round(d)} vélo(s) en ~15 min.` };
      if (d >= 1) return { emoji:'↗️', texte:`Station en hausse : +${Math.round(d)} vélo(s) récemment.` };
      return { emoji:'➡️', texte:'Station relativement stable sur les dernières minutes.' };
    }

    function analyserEffetGarePrecis(h, m) {
      const cible = h * 60 + m;
      const train = ARRIVEES_GARE_EPINAL
        .map(t => {
          let delta = minutesTrain(t) - cible;
          if (delta < 0) delta += 1440;
          return { ...t, delta };
        })
        .sort((a, b) => a.delta - b.delta)[0];

      if (!train) {
        return { facteur: 1, texte: 'Aucune arrivée ferroviaire disponible.' };
      }

      const facteur = train.delta <= 2 ? 1.18 : train.delta <= 5 ? 1.11 : train.delta <= 10 ? 1.06 : 1;
      const quand = train.delta === 0 ? 'maintenant'
        : train.delta < 60 ? `dans ${train.delta} min`
        : `dans ${Math.floor(train.delta / 60)} h ${train.delta % 60} min`;
      const numero = train.numero ? ` ${train.numero}` : '';

      return {
        facteur,
        texte: `Prochaine arrivée : ${String(train.h).padStart(2, '0')}h${String(train.m).padStart(2, '0')} — ${train.type}${numero}, en provenance de ${train.provenance} (${quand}).`
      };
    }

    async function calculerConseilMinute() {
      const hVise = parseInt(document.getElementById('heureSelect').value);
      const mVise = parseInt(document.getElementById('minuteSelect').value);
      const delaiMin = parseInt(document.getElementById('delaiSelect').value);
      const station = document.getElementById('stationSelect').value;
      const boxEl = document.getElementById('boxConseil');

      if (!donneesGlobales || donneesGlobales.length === 0) {
        boxEl.className = "reservation-box";
        document.getElementById('conseilTexte').innerHTML = `Aucune donnée disponible pour cet horaire ou cette station.`;
        return;
      }

      const zone = estZoneEpinalGolbey(station);
      const velosVises = estimerVelosAMinute(hVise, mVise);
      const jour = parseInt(document.getElementById('jourSelect').value);
      const facteurAdaptatif = lireCorrectionAdaptive(station, jour, hVise);

      // Signaux déjà présents dans le programme + effet gare plus précis.
      const signalEcoles = zone ? obtenirSignalEcoles(hVise, mVise) : { facteur:1, texte:'' };
      const signalTrainBase = zone ? obtenirSignalFerroviaire(hVise, mVise) : { facteur:1, texte:'' };
      const signalTrainPrecis = zone ? analyserEffetGarePrecis(hVise, mVise) : { facteur:1, texte:'' };
      const facteurHoraire = zone ? obtenirFacteurHoraireEpinal(hVise, mVise) : 1;
      const facteurContexte = Math.max(facteurHoraire, signalEcoles.facteur, signalTrainBase.facteur, signalTrainPrecis.facteur);

      // Données réelles récentes : servent à détecter la direction de la station
      // et à adapter progressivement la prévision sans modifier la base SQL.
      const relevesRecents = await chargerHistoriqueRecent(station);
      const tendance = calculerTendanceRecente(relevesRecents, hVise, mVise);
      const remplissage = analyserRemplissage(relevesRecents);

      // Prévision stricte sur 0 à 5 minutes.
      const previsions = prevoir5Minutes(hVise, mVise, velosVises, tendance, facteurAdaptatif, facteurContexte);
      const pirePrevision = Math.min(...previsions.map(p => p.velos));
      const meilleurePrevision = Math.max(...previsions.map(p => p.velos));
      const p5 = previsions[previsions.length - 1].velos;

      let debitConsommation = tendance < 0 ? -tendance : 0;
      let delaiRecommande = delaiMin;
      if (debitConsommation > 0.3) delaiRecommande = Math.min(5, delaiMin + 2);
      else if (debitConsommation > 0.15) delaiRecommande = Math.min(5, delaiMin + 1);
      if (zone && facteurContexte >= 1.15) delaiRecommande = Math.min(5, delaiRecommande + 1);
      if (pirePrevision <= 0.6) delaiRecommande = Math.min(5, Math.max(delaiRecommande, 4));

      // Mise à jour légère de l'apprentissage : on compare la mesure la plus
      // récente au niveau historique attendu. L'effet reste plafonné.
      if (relevesRecents.length) {
        const dernier = relevesRecents
          .map(r => ({t:new Date(r.date_releve).getTime(),v:Number(r.velos_disponibles)}))
          .filter(r=>Number.isFinite(r.t)&&Number.isFinite(r.v))
          .sort((a,b)=>b.t-a.t)[0];
        if (dernier && velosVises > 0.5 && Date.now()-dernier.t < 30*60*1000) {
          const observation = Math.max(0.75, Math.min(1.25, dernier.v / velosVises));
          enregistrerCorrectionAdaptive(station, jour, hVise, observation);
        }
      }

      let mResa = mVise - delaiRecommande;
      let hResa = hVise;
      if (mResa < 0) { mResa += 60; hResa = (hVise - 1 + 24) % 24; }

      const txtVise = `${String(hVise).padStart(2,'0')}:${String(mVise).padStart(2,'0')}`;
      const txtResa = `${String(hResa).padStart(2,'0')}:${String(mResa).padStart(2,'0')}`;
      const confiance = Math.round(Math.max(45, Math.min(95,
        65 + (relevesRecents.length > 20 ? 10 : 0) + (Math.abs(tendance) < 0.15 ? 8 : 0) - (facteurContexte > 1.15 ? 5 : 0)
      )));

      boxEl.className = 'reservation-box';
      let conseilHTML = `<b>À ${txtVise} :</b> environ <b>${velosVises.toFixed(1)} vélo(s)</b> disponible(s) à la station ${station}.<br><br>`;

      conseilHTML += `<b> Prévision +5 min :</b> ${p5.toFixed(1)} vélo(s) probables. `;
      conseilHTML += `Plage prévue sur 5 min : <b>${pirePrevision.toFixed(1)} à ${meilleurePrevision.toFixed(1)}</b> vélo(s).<br>`;
      conseilHTML += `<small>Confiance estimée : ${confiance} % · correction adaptative hebdomadaire : ×${facteurAdaptatif.toFixed(2)}</small><br><br>`;

      if (zone) {
        conseilHTML += `<small>${signalTrainBase.texte}<br>${signalEcoles.texte}`;
        if (remplissage) conseilHTML += `<br>${remplissage.emoji} ${remplissage.texte}`;
        conseilHTML += `</small><br><br>`;
      } else if (remplissage) {
        conseilHTML += `<small>${remplissage.emoji} ${remplissage.texte}</small><br><br>`;
      }

      if (velosVises <= 0.6 || pirePrevision <= 0.6) {
        boxEl.classList.add('critical');
        conseilHTML += `<span class="alert-warn">Attention : risque élevé d'absence de vélos dans les prochaines minutes.</span><br>`;
        conseilHTML += `Conseil : lancez la réservation dès <span class="highlight">${txtResa}</span> (${delaiRecommande} minutes avant votre départ).`;
      } else if (debitConsommation > 0.2 || facteurContexte >= 1.15 || pirePrevision < velosVises - 0.5) {
        boxEl.classList.add('warning');
        conseilHTML += `<b>Période de demande renforcée :</b> la tendance actuelle indique une baisse d'environ ${Math.max(0, debitConsommation*5).toFixed(1)} vélo(s) sur 5 minutes.`;
        conseilHTML += `<br>Conseil : effectuez votre réservation à <span class="highlight">${txtResa}</span>.`;
      } else {
        conseilHTML += `<b>Fréquentation normale :</b> la disponibilité devrait rester relativement stable sur les 5 prochaines minutes.<br>`;
        conseilHTML += `Conseil : vous pouvez réserver votre vélo à <span class="highlight">${txtResa}</span> (${delaiRecommande} minutes avant).`;
      }

      // Station voisine : logique existante conservée, avec +5 min de trajet.
      if (zone && (velosVises <= 1.5 || pirePrevision <= 1.5)) {
        const voisines = await trouverStationsVoisines(station);
        if (voisines.length > 0) {
          const meilleure = voisines[0];
          const anticipationVoisine = Math.min(5, Math.max(delaiMin, delaiRecommande));
          const totalAvant = anticipationVoisine + TEMPS_DEPLACEMENT_VOISINE;
          let hAlt = hVise, mAlt = mVise - totalAvant;
          while (mAlt < 0) { mAlt += 60; hAlt = (hAlt - 1 + 24) % 24; }
          conseilHTML += `<br><b>🚲 Alternative :</b> ${meilleure.nom} est à environ ${Math.round(meilleure.distance)} m, avec <b>${meilleure.velos}</b> vélo(s) actuellement disponible(s).`;
          conseilHTML += `<br>Avec les <b>+${TEMPS_DEPLACEMENT_VOISINE} min</b> de déplacement : réservation conseillée vers <span class="highlight">${String(hAlt).padStart(2,'0')}:${String(mAlt).padStart(2,'0')}</span>.`;
        }
      }

      document.getElementById('conseilTexte').innerHTML = conseilHTML;
    }

    window.addEventListener('DOMContentLoaded', initialiser);
  </script>
